[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hetero-spectral-lm-jax"
version = "0.4.0"
description = "JAX/Flax open-science reference for 3:1 Spectral-Reservoir LMs (Clean BF16, W4 INT4 / 1.58-bit Analog CIM, & 12.5 Hz Causal Audio Turn-Taking)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.35",
    "flax>=0.9.0",
    "optax>=0.2.3",
    "orbax-checkpoint>=0.6.0",
    "etils>=1.9.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
