[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hetero-spectral-lm-jax"
version = "0.3.0"
description = "JAX/Flax prototype for Hetero-Physical 1.58-Bit Spectral-Reservoir Language Models (TPU/XLA static-shape scaling study)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.35",
    "flax>=0.9.0",
    "optax>=0.2.3",
    "orbax-checkpoint>=0.6.0",
    "etils>=1.9.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
